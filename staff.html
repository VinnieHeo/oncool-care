<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>온앤쿨케어 추천·선정 관리</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css?v=6">
<style>
.wrap{max-width:1180px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:10px 0 14px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1 1 110px}
.st b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.st span{font-size:12.5px;color:var(--mute)}
.st.w b{color:var(--warm)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar select,.bar input{width:auto;font-size:14px;padding:7px 10px}
.bar .sp{flex:1}
.sbtn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.sbtn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sbtn.dan{color:var(--warm);border-color:var(--warm)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:980px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--bg);font-size:12.5px;color:var(--mute);position:sticky;top:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--bg)} tbody tr.sel{background:var(--cool-soft)}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}
.t1{background:var(--cool-soft);color:var(--cool);border-color:transparent}.t2{background:var(--amber-soft);color:var(--amber);border-color:transparent}.t3{background:var(--green-soft);color:var(--green);border-color:transparent}.t4{background:var(--warm-soft);color:var(--warm);border-color:transparent}
.flag{color:var(--warm);font-weight:600}
.panel{margin-top:14px}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:14px}
.dl dt{color:var(--mute)} .dl dd{margin:0;white-space:pre-wrap}
.ed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.ed label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.ed .full{grid-column:1/-1}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.msg{font-size:13.5px;color:var(--green)}
@media (max-width:640px){.ed{grid-template-columns:1fr}.dl{grid-template-columns:110px minmax(0,1fr)}}
body.embed{background:transparent}
body.embed .wrap{padding:0 2px 8px;max-width:none}
body.embed .eyebrow,body.embed h1,body.embed .foot{display:none}
body.embed #login{max-width:none!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
body.embed #login h2{margin:0;font-size:15px}
body.embed #login .hint{width:100%;margin:0}
body.embed #login .q{margin:0;flex:1 1 180px;max-width:260px}
body.embed #login .q input{padding:7px 10px;font-size:14px}
body.embed #login>div[style]{margin:0!important}
body.embed #login .btn{width:auto;padding:8px 18px;font-size:14px}
body.embed #login .err{width:100%}
</style>
</head><body><div class="wrap">
<div class="eyebrow">온앤쿨케어 · 복지관 내부 열람용</div>
<h1>대상가구 추천 · 선정 관리</h1>
<div class="stats" id="pstats"></div>
<section class="card" id="login" style="max-width:420px">
  <h2>비밀번호</h2>
  <p class="hint">추천받은 가구의 개인정보가 있어서 비밀번호를 넣어야 볼 수 있어요. 보기만 할 때는 열람 비밀번호, 가정방문 기록과 증빙 서류를 고칠 때는 편집 비밀번호를 넣어요.</p>
  <div class="q" id="enq" hidden><label for="en" style="font-size:13px;color:var(--mute)">이름 (누가 고쳤는지 기록돼요)</label><input type="text" id="en" maxlength="20" autocomplete="name"></div>
  <div class="q"><input type="password" id="pw" autocomplete="current-password" aria-label="비밀번호" placeholder="열람 비밀번호"></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px"><input type="checkbox" id="edmode" style="width:18px;height:18px"> 가정방문 기록·서류를 고치러 왔어요 (편집 비밀번호)</label>
  <p class="err" id="lerr" hidden></p>
  <div style="margin-top:12px"><button class="btn" id="lbtn" type="button">보기</button></div>
</section>
<div id="app" hidden>
  <div class="vtabs" role="tablist"><button role="tab" id="vt-ref" aria-selected="true" type="button">추천 접수</button><button role="tab" id="vt-case" aria-selected="false" type="button">선정 심사 <span id="ccnt"></span></button></div>
  <div id="vw-case" hidden>
    <div id="cgoal"></div>
    <div class="bar"><select id="cfs" aria-label="단계"><option value="">단계 전체</option><option>조사중</option><option>서류완비</option><option>위원회상정</option><option>선정</option><option>보류</option><option>탈락</option></select><span class="sp"></span><button class="sbtn" id="ccsv" type="button">위원회 자료 받기 (엑셀)</button></div>
    <div id="clist"></div>
    <section class="card panel" id="cview" hidden></section>
    <section class="card panel" id="cedit" hidden></section>
  </div>
  <div id="vw-ref">
  <div class="stats" id="stats"></div>
  <div class="bar">
    <select id="fs" aria-label="상태"><option value="">상태 전체</option><option>접수</option><option>검토중</option><option>선정</option><option>보류</option><option>제외</option></select>
    <select id="ft" aria-label="예상 유형"><option value="">유형 전체</option><option value="1">1유형</option><option value="2">2유형</option><option value="3">3유형</option><option value="?">유형 미확인</option><option value="4">4유형 후보</option></select>
    <input type="text" id="fq" placeholder="이름·추천자·거주동 검색" aria-label="검색">
    <span class="sp"></span>
    <button class="sbtn" id="reload" type="button">새로고침</button>
    <button class="sbtn" id="csv" type="button">엑셀(CSV) 받기</button>
    <span class="chip2 info" id="edbadge" hidden></span>
    <button class="sbtn" id="out" type="button">닫기</button>
  </div>
  <div class="tw"><table><thead><tr><th>번호</th><th>접수</th><th>대상자</th><th>거주동</th><th>가구원</th><th>소득</th><th>예상 유형</th><th>난방</th><th>통장</th><th>긴급</th><th>추천자</th><th>상태</th><th>가구코드</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="hint" id="cnt" style="margin:8px 2px"></p>
  <section class="card panel" id="detail" hidden></section>
  </div>
</div>
<p class="foot">편집 비밀번호로 들어오면 가정방문 기록과 증빙 서류를 고칠 수 있고, 고친 사람 이름이 남아요. 내용은 외부에 공유하지 말아 주세요.</p>
</div>
<script src="detail.js?v=6"></script>
<script src="cases.js?v=6"></script>
<script>
const SB="https://ssqktlqwkhvuxduimsyd.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzcWt0bHF3a2h2dXhkdWltc3lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDY0ODAsImV4cCI6MjEwMjY4MjQ4MH0.YYxe7jJIUw6nq94hsbV0lwXIJXjCERlYOvQAYvL9l2M";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PASS="",rows=[],selId=null;
const who=r=>`${r.worker_org||"생활지원사"} · ${r.worker_name||""}`;
const typeOf=r=>r.voucher==="안 받음"?"1":r.voucher==="받았는데 다 씀"?"2":r.voucher==="받는 중"?"3":"?";
const is4=r=>["기름(등유) 보일러","LPG","연탄"].includes(r.heating);
const tpill=r=>{const t=typeOf(r);return (t==="?"?'<span class="pill">미확인</span>':`<span class="pill t${t}">${t}유형</span>`)+(is4(r)?' <span class="pill t4">4유형 후보</span>':"")};
const d=s=>{const x=new Date(s);return `${x.getMonth()+1}/${x.getDate()} ${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}`};
async function fetchList(p){const r=await fetch(SB+"/rest/v1/rpc/oncool_staff_list",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_pass:p})});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function load(p){const res=await fetchList(p);
  if(!res.ok){$("#lerr").textContent=res.reason==="locked"?"틀린 비밀번호가 많아 잠시 잠겼어요. 15분 뒤에 다시 해 주세요.":"비밀번호가 맞지 않아요.";$("#lerr").hidden=false;return false}
  PASS=p;rows=res.rows||[];CASES=res.cases||[];$("#ccnt").textContent=CASES.length?`(${CASES.length})`:"";renderCases();renderStats(res.stats);render();$("#login").hidden=true;$("#pstats").hidden=true;$("#app").hidden=false;return true}
let ETOK="",EDNAME="";try{ETOK=sessionStorage.getItem("oc_etok")||"";EDNAME=sessionStorage.getItem("oc_ename")||""}catch(e){}
$("#edmode").onchange=()=>{$("#enq").hidden=!$("#edmode").checked;$("#pw").placeholder=$("#edmode").checked?"편집 비밀번호":"열람 비밀번호"};
async function rpcS(fn,b){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||("HTTP "+r.status));return j}
async function loadEd(){const res=await rpcS("oncool_ed_data",{p_token:ETOK});rows=res.rows||[];CASES=res.cases||[];$("#ccnt").textContent=CASES.length?`(${CASES.length})`:"";renderStats(res.stats);render();renderCases();
  $("#edbadge").hidden=false;$("#edbadge").textContent="편집 중 · "+EDNAME;$("#login").hidden=true;$("#pstats").hidden=true;$("#app").hidden=false}
async function edLogin(){const name=$("#en").value.trim();if(!name){$("#lerr").textContent="이름을 넣어 주세요.";$("#lerr").hidden=false;$("#en").focus();return}
  const res=await rpcS("oncool_ed_login",{p_pass:$("#pw").value,p_name:name});
  if(!res.ok){$("#lerr").textContent=res.reason==="locked"?"틀린 비밀번호가 많아 잠시 잠겼어요. 15분 뒤에 다시 해 주세요.":"편집 비밀번호가 맞지 않아요.";$("#lerr").hidden=false;return}
  ETOK=res.token;EDNAME=res.name;try{sessionStorage.setItem("oc_etok",ETOK);sessionStorage.setItem("oc_ename",EDNAME)}catch(e){}$("#pw").value="";await loadEd()}
$("#lbtn").onclick=async()=>{if($("#edmode").checked){$("#lerr").hidden=true;$("#lbtn").disabled=true;try{await edLogin()}catch(e){$("#lerr").textContent="연결이 안 돼요. 잠시 뒤에 다시 해 주세요.";$("#lerr").hidden=false}finally{$("#lbtn").disabled=false}return}$("#lerr").hidden=true;$("#lbtn").disabled=true;try{const ok=await load($("#pw").value);if(ok)$("#pw").value=""}catch(e){$("#lerr").textContent="연결이 안 돼요. 잠시 뒤에 다시 해 주세요.";$("#lerr").hidden=false}finally{$("#lbtn").disabled=false}};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)$("#lbtn").click()});
$("#reload").onclick=()=>load(PASS).catch(()=>{});
$("#out").onclick=()=>{ETOK="";EDNAME="";try{sessionStorage.removeItem("oc_etok");sessionStorage.removeItem("oc_ename")}catch(e){}$("#edbadge").hidden=true;$("#cedit").hidden=true;PASS="";rows=[];$("#tb").innerHTML="";$("#detail").hidden=true;$("#app").hidden=true;$("#login").hidden=false;$("#pstats").hidden=false;pub()};
function renderStats(s){if(!s)return;
  const it=[["추천",s.total],["1유형",s.type1],["2유형",s.type2],["3유형",s.type3],["유형 미확인",s.type_unknown,1],["4유형 후보",s.type4_candidates],["통장 없음·압류",s.no_account,1],["긴급 ‘상’",s.urgent,1],["선정",s.selected],["추천한 사람",s.workers]];
  $("#stats").innerHTML=it.map(([l,v,w])=>`<div class="st${w&&v?" w":""}"><b>${v??0}</b><span>${l}</span></div>`).join("");
}
function filtered(){const s=$("#fs").value,t=$("#ft").value,q=$("#fq").value.trim();
  return rows.filter(r=>(!s||r.status===s)&&(!t||(t==="4"?is4(r):typeOf(r)===t))&&(!q||[r.elder_name,r.worker_name,r.dong].some(x=>(x||"").includes(q))))}
function render(){const f=filtered();
  $("#tb").innerHTML=f.map(r=>`<tr data-id="${r.id}" class="${r.id===selId?"sel":""}" tabindex="0"><td>${r.receipt_no}</td><td>${d(r.created_at)}</td><td><b>${esc(r.elder_name)}</b></td><td>${esc(r.dong)}</td><td>${r.household_size?r.household_size+"명":""}</td><td>${esc(r.income)}</td><td>${tpill(r)}</td><td>${esc(r.heating)}</td><td class="${["없음","압류 우려"].includes(r.account)?"flag":""}">${esc(r.account)}</td><td class="${r.urgency==="상"?"flag":""}">${esc(r.urgency)}</td><td>${esc(who(r))}</td><td>${esc(r.status)}</td><td>${esc(r.household_code)}</td></tr>`).join("")||'<tr><td colspan="13" style="color:var(--mute)">아직 추천이 없어요.</td></tr>';
  $("#cnt").textContent=`${f.length}건 표시 · 전체 ${rows.length}건`;
}
["fs","ft"].forEach(i=>$("#"+i).onchange=render);$("#fq").oninput=render;$("#reload").onclick=load;
$("#tb").addEventListener("click",e=>{const tr=e.target.closest("tr[data-id]");if(tr)openD(tr.dataset.id)});
$("#tb").addEventListener("keydown",e=>{if(e.key==="Enter"){const tr=e.target.closest("tr[data-id]");if(tr)openD(tr.dataset.id)}});
const F=[["접수 번호","receipt_no"],["접수 일시","created_at",d],["추천자","worker_name"],["추천자 소속","worker_org"],["대상자","elder_name"],["생년월일","birth"],["성별","gender"],["연락처","phone"],["거주동","dong"],["주소","address"],["세대주 본인","is_head"],["세대주 성함","head_name"],["세대주 생년월일","head_birth"],["가구원 수","household_size"],["실제 동거","live_with"],["소득 구분","income"],["수급 종류","recipient_kinds",a=>(a||[]).join(", ")],["에너지바우처","voucher"],["난방 방식","heating"],["본인 명의 통장","account"],["고지서 사진","bill_photo"],["집","housing_tenure"],["주거 위험","housing_risk",a=>(a||[]).join(", ")],["난방기구 고장","heater_broken"],["요금 체납","arrears",a=>(a||[]).join(", ")],["긴급도","urgency"],["추천 사유","reason"],["건강·생활 위험","risk_note"],["다른 지원","other_support"]];
function openD(id){selId=id;render();const r=rows.find(x=>x.id===id);if(!r)return;
  $("#detail").hidden=false;
  $("#detail").innerHTML=DV.html(r,{staff:true})+`<div class="acts">${ETOK?`<button class="sbtn pri" id="e_case" type="button">${CASES.find(c=>c.referral_id===r.id)?"선정 심사 카드 열기":"가정방문 기록 시작"}</button>`:""}<button class="sbtn" id="e_close" type="button">닫기</button></div>`;
  if($("#e_case"))$("#e_case").onclick=async()=>{try{const c=await rpcS("oncool_ed_case_start",{p_token:ETOK,p_referral:r.id});const i=CASES.findIndex(x=>x.id===c.id);if(i<0)CASES.push(c);else CASES[i]=c;if(r.status==="접수")r.status="검토중";render();$("#ccnt").textContent=`(${CASES.length})`;vtab("case");renderCases();$("#cview").hidden=true;CSE.open(c,r)}catch(x){alert2(x)}};
  $("#e_close").onclick=()=>{selId=null;$("#detail").hidden=true;render()};
  $("#detail").scrollIntoView({behavior:"smooth",block:"start"});
}
$("#csv").onclick=()=>{const cols=[...F.map(f=>f[0]),"예상 유형","4유형 후보","상태","가구코드","메모"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[cols.map(q).join(",")].concat(filtered().map(r=>[...F.map(([l,k,fn])=>fn?fn(r[k]):r[k]),typeOf(r)==="?"?"미확인":typeOf(r)+"유형",is4(r)?"예":"",r.status,r.household_code,r.staff_memo].map(q).join(",")));
  const b=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`온앤쿨_추천명단_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)};
$("#reload").onclick=()=>(ETOK?loadEd():load(PASS)).catch(()=>{});
/* 선정 심사 (보기 전용) */
let CASES=[];
function vtab(w){$("#vt-ref").setAttribute("aria-selected",w==="ref");$("#vt-case").setAttribute("aria-selected",w==="case");$("#vw-ref").hidden=w!=="ref";$("#vw-case").hidden=w!=="case"}
$("#vt-ref").onclick=()=>vtab("ref");$("#vt-case").onclick=()=>{vtab("case");renderCases()};
function renderCases(){const f=$("#cfs").value;$("#cgoal").innerHTML=CS.goal(CASES);$("#clist").innerHTML=CS.listHTML(CASES.filter(c=>!f||c.stage===f),rows)}
$("#cfs").onchange=renderCases;$("#ccsv").onclick=()=>CS.csv(CASES,rows);
$("#clist").addEventListener("click",e=>{const tr=e.target.closest("tr[data-cid]");if(!tr)return;const c=CASES.find(x=>x.id===tr.dataset.cid);const r=rows.find(x=>x.id===c.referral_id)||{};
  if(ETOK){$("#cview").hidden=true;CSE.open(c,r);return}
  $("#cview").hidden=false;$("#cview").innerHTML=CS.viewHTML(c,r)+'<p class="hint" style="margin-top:10px">증빙 파일 원본은 담당자 관리 페이지에서만 열 수 있어요.</p><div class="acts"><button class="sbtn" type="button" id="cvclose">닫기</button></div>';$("#cvclose").onclick=()=>$("#cview").hidden=true;$("#cview").scrollIntoView({behavior:"smooth",block:"start"})});
function alert2(x){const m=/session/.test(x.message)?"편집 시간이 끝났어요. 닫기 후 편집 비밀번호로 다시 들어와 주세요.":"처리하지 못했어요: "+x.message;$("#cnt").textContent=m}
/* 편집 백엔드: 비밀번호 세션 + 증빙 파일 함수 */
const EFN=SB+"/functions/v1/oncool-evidence";
async function efn(b){const r=await fetch(EFN,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(Object.assign({token:ETOK},b))});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j}
CSE.init({
  async save(id,up){return await rpcS("oncool_ed_case_save",{p_token:ETOK,p_case:id,p:up})},
  async list(cid,k){return (await efn({action:"list",case_id:cid,doc:k})).files||[]},
  async upload(cid,k,b,type){const u=await efn({action:"upload_url",case_id:cid,doc:k,content_type:type});const r=await fetch(u.signedUrl,{method:"PUT",headers:{"Content-Type":type},body:b});if(!r.ok)throw new Error("업로드 실패 "+r.status)},
  async open(cid,path){return (await efn({action:"sign",case_id:cid,path})).url},
  async remove(cid,path){await efn({action:"remove",case_id:cid,path})}
},{saved(c){const r=rows.find(x=>x.id===c.referral_id);if(r){r.status={"선정":"선정","탈락":"제외","보류":"보류"}[c.stage]||"검토중";r.household_code=c.household_code}renderCases();render()}});
if(ETOK)loadEd().catch(()=>{ETOK="";try{sessionStorage.removeItem("oc_etok")}catch(e){}});
/* 공개 숫자 (이름 없음) */
function pub(){fetch(SB+"/rest/v1/rpc/oncool_stats",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:"{}"}).then(r=>r.json()).then(st=>{
  const it=[["추천",st.total],["방문",st.visited],["서류 완비",st.docs_done],["1유형",st.type1],["2유형",st.type2],["3유형",st.type3],["4유형 후보",st.type4_candidates],["유형 미확인",st.type_unknown,1],["통장 없음·압류",st.no_account,1],["긴급 ‘상’",st.urgent,1],["선정",st.selected],["추천한 사람",st.workers]];
  $("#pstats").innerHTML=it.map(([l,v,w])=>`<div class="st${w&&v?" w":""}"><b>${v??0}</b><span>${l}</span></div>`).join("")}).catch(()=>{})}
pub();
