<script>
const SB="https://ssqktlqwkhvuxduimsyd.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzcWt0bHF3a2h2dXhkdWltc3lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDY0ODAsImV4cCI6MjEwMjY4MjQ4MH0.YYxe7jJIUw6nq94hsbV0lwXIJXjCERlYOvQAYvL9l2M";

async function fetchList(p){const r=await fetch(SB+"/rest/v1/rpc/oncool_staff_list",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_pass:p})});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function load(p){const res=await fetchList(p);

  $("#edbadge").hidden=false;$("#edbadge").textContent="편집 중 · "+EDNAME;$("#chpw").hidden=false;$("#login").hidden=true;$("#pstats").hidden=true;$("#app").hidden=false}
async function edLogin(){const name=$("#en").value.trim();if(!name){$("#lerr").textContent="이름을 넣어 주세요.";$("#lerr").hidden=false;$("#en").focus();return}

 "보류 안내":(r)=>`[온앤쿨케어] ${r.worker_name||""} 선생님, 추천하신 ${nmask(r.elder_name)} 님(접수 ${r.receipt_no}번) 가구는 이번 심사에서 보류됐어요. 자세한 내용은 담당자에게 문의해 주세요.`};
const nbytes=t=>[...t].reduce((n,ch)=>n+(ch.charCodeAt(0)<128?1:2),0);
const smsHref=(ph,body)=>`sms:${(ph||"").replace(/[^0-9]/g,"")}?&body=${encodeURIComponent(body)}`;
function nblock(c){const r=rows.find(x=>x.id===c.referral_id)||{};const el=document.createElement("div");el.className="vmode";
  const draw=()=>{const m=c.visit_mode||"추천자",tk=el.dataset.tk||(c.stage==="선정"?"선정 안내":["보류","탈락"].includes(c.stage)?"보류 안내":"방문 요청"),body=NTPL[tk](r,c),n=nbytes(body);
    el.innerHTML=`<div class="vrow"><b>방문 방식</b><div class="seg" role="group" aria-label="방문 방식">${NMODE.map(([k,l])=>`<button type="button" data-vm="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div><small>기본은 추천자 방문이에요. 바꾸면 추천자 화면 안내가 바로 바뀌어요.</small></div>
    ${c.visit_req?`<div class="vreq"><span>추천자 요청 · ${ntime(c.visit_req_at)}</span><b>‘${esc(c.visit_req)}’</b><div><button type="button" class="sbtn pri" data-acc="1">요청대로 바꾸기</button><button type="button" class="sbtn" data-rej="1">추천자 방문 유지</button></div></div>`:""}
    ${c.w_done_at?`<div class="vok">추천자가 <b>방문·서류 다 했어요</b>를 눌렀어요 · ${ntime(c.w_done_at)}</div>`:""}
    <div class="sms"><div class="vrow"><b>추천자에게 문자</b><select id="smsT" aria-label="문구 종류">${Object.keys(NTPL).map(k=>`<option${k===tk?" selected":""}>${k}</option>`).join("")}</select><small>${esc(r.worker_name||"")} · ${esc(r.worker_phone||"번호 없음")}</small></div>
    <textarea id="smsB" rows="4" aria-label="문자 내용">${esc(body)}</textarea>
    <div class="srow">${r.worker_phone?`<a class="sbtn pri" id="smsGo" href="${smsHref(r.worker_phone,body)}">문자 앱 열기</a>`:'<span class="hint" style="margin:0">추천자 번호가 없어요</span>'}<small id="smsLen" class="${n>90?"long":""}">${n<=90?"단문 · "+n+"/90바이트":"장문 문자로 나가요"}</small><small>휴대폰에서 누르면 문구가 채워진 문자 창이 열려요. 대상자 이름은 가려서 보내요.</small></div></div>`};
  const setMode=async(mode)=>{try{const nc=await rpcS("oncool_ed_case_mode",{p_token:ETOK,p_case:c.id,p_mode:mode});Object.assign(c,{visit_mode:nc.visit_mode,visit_req:nc.visit_req,visit_req_at:nc.visit_req_at});draw();renderCases()}catch(x){alert2(x)}};
  draw();
  el.addEventListener("click",ev=>{const b=ev.target.closest("[data-vm]");if(b){setMode(b.dataset.vm);return}
    if(ev.target.closest("[data-acc]")){setMode(c.visit_req==="같이 가 주세요"?"동행":"복지관");return}
    if(ev.target.closest("[data-rej]"))setMode(c.visit_mode||"추천자")});
  el.addEventListener("change",ev=>{if(ev.target.id==="smsT"){el.dataset.tk=ev.target.value;draw()}});
  el.addEventListener("input",ev=>{if(ev.target.id!=="smsB")return;const v=ev.target.value,n=nbytes(v),L=el.querySelector("#smsLen");L.textContent=n<=90?"단문 · "+n+"/90바이트":"장문 문자로 나가요";L.classList.toggle("long",n>90);const g=el.querySelector("#smsGo");if(g)g.href=smsHref(r.worker_phone,v)});
  return el}
{const _o=CSE.open;CSE.open=function(c,r){_o.apply(this,arguments);if(!ETOK)return;const s=$("#cedit .dv-sub");if(s&&!$("#cedit .vmode"))s.after(nblock(CASES.find(x=>x.id===c.id)||c))}}
{const _ld=loadEd;loadEd=async function(){await _ld();ntop();ndecor();try{const g=JSON.parse(sessionStorage.getItem("oc_goto")||"null");if(g){sessionStorage.removeItem("oc_goto");ngo(g.c,g.r)}}catch(e){}}}
{const _out=$("#out").onclick;$("#out").onclick=function(){const d=$("#ntop");if(d)d.remove();return _out.apply(this,arguments)}}
document.addEventListener("click",e=>{const p=$("#npanel");if(p&&!p.hidden&&!e.target.closest("#npanel,#bell"))p.hidden=true});

SIGN.staffHook(rpcS,()=>ETOK);
JUDGE.hook(rpcS,()=>ETOK,()=>CASES,()=>rows);
ANNEX.hook(rpcS,()=>ETOK,()=>CASES,()=>rows);
DOCREQ.staff(rpcS,()=>ETOK);
PAY.hook(rpcS,()=>ETOK,()=>CASES,()=>rows,()=>EDNAME);
ACCT.hook(rpcS,()=>ETOK);
FAQS.hook(rpcS,()=>ETOK);
if(ETOK)loadEd().catch(()=>{ETOK="";try{sessionStorage.removeItem("oc_etok")}catch(e){}});
/* 공개 숫자 (이름 없음) */
function pub(){fetch(SB+"/rest/v1/rpc/oncool_stats",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:"{}"}).then(r=>r.json()).then(st=>{
  const it=[["추천",st.total],["방문",st.visited],["서류 완비",st.docs_done],["1유형",st.type1],["2유형",st.type2],["3유형",st.type3],["4유형 후보",st.type4_candidates],["유형 미확인",st.type_unknown,1],["통장 없음·압류",st.no_account,1],["긴급 ‘상’",st.urgent,1],["선정",st.selected],["추천한 사람",st.workers]];
  $("#pstats").innerHTML=it.map(([l,v,w])=>`<div class="st${w&&v?" w":""}"><b>${v??0}</b><span>${l}</span></div>`).join("")}).catch(()=>{})}
pub();

if(new URLSearchParams(location.search).has("embed")){document.body.classList.add("embed");
  const post=()=>{try{parent.postMessage({oncoolH:document.documentElement.scrollHeight},"*")}catch(e){}};
  new ResizeObserver(post).observe(document.body);window.addEventListener("load",post);post()}
